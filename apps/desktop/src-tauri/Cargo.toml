[package]
name = "profiledock-desktop"
version = "0.3.0"
description = "ProfileDock Desktop Application"
authors = ["ProfileDock"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "profiledock-desktop"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
sha2 = "0.10.9"
hex = "0.4.3"
zip = "4.2.0"
tar = "0.4.46"
flate2 = "1.1.10"
futures-util = "0.3.34"
open = "5.3.2"

[[bin]]
name = "seed-profiles"
path = "src/bin/seed-profiles.rs"

[dev-dependencies]
tempfile = "3"
